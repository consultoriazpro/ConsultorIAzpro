
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud recibida | ConsultorIAzpro</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #09142c, #20205c);
      font-family: Arial, sans-serif;
      color: #101b34;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 48px 36px;
      background: white;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 70px #0004;
    }

    .check {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #dcfce7;
      color: #15803d;
      font-size: 40px;
    }

    h1 { font-size: 30px; margin: 0 0 18px; }

    p {
      color: #64748b;
      font-size: 17px;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 28px;
      border-radius: 12px;
      background: #315bdc;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>¡Solicitud recibida!</h1>
    <p>
      Gracias por contactar con ConsultorIAzpro.
      Hemos recibido tu solicitud de consultoría.
    </p>
    <p>
      Nuestro equipo revisará tu mensaje y
      se pondrá en contacto contigo lo antes posible.
    </p>
    <a class="btn" href="index.html">
      Volver a la página principal
    </a>
  </main>
</body>
</html>
